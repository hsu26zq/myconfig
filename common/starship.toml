format = "$username$hostname$directory$time$git_branch[](fg:#ffa500)$line_break$character"
add_newline = true

[username]
style_user = "bg:#ff0000 fg:#ffffff"
style_root = "bg:#ff0000 fg:#ffffff"
format = "[ $user ]($style)[](fg:#ff0000 bg:#ff3700)"
show_always = true
disabled = false

[hostname]
ssh_only = false
style = "bg:#ff3700 fg:#ffffff"
format = "[ $hostname ]($style)[](fg:#ff3700 bg:#ff6e00)"
disabled = false

[directory]
style = "bg:#ff6e00 fg:#ffffff"
format = "[ $path ]($style)[](fg:#ff6e00 bg:#ffa500)"
truncation_length = 3
truncate_to_repo = false

[time]
disabled = false
time_format = "%H:%M"
style = "bg:#ffa500 fg:#000000"
format = "[ $time ]($style)"

[git_branch]
symbol = ""
style = "bg:#ffa500 fg:#000000"
format = "[](fg:#ffa500 bg:#ffa500)[ $symbol$branch ]($style)"

[line_break]
disabled = false

[character]
success_symbol = "[❯](bold fg:#ff0000)"
error_symbol = "[✗](bold fg:#ff0000)"
