# Prefix: Ctrl+a instead of default Ctrl+b (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse: click a pane to focus it, drag a border to resize, scroll for history
set -g mouse on

# Windows/panes start at 1, not 0 (matches the number row)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# No delay after pressing Escape (matters most inside vim)
set -sg escape-time 10

# More scrollback
set -g history-limit 10000

# Stay attached to another session instead of exiting when one is killed
set -g detach-on-destroy off

# Split panes with | and - (shows the split direction), open in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window opens in the current directory too
bind c new-window -c "#{pane_current_path}"

# Switch panes: prefix + arrow key
bind Left  select-pane -L
bind Right select-pane -R
bind Up    select-pane -U
bind Down  select-pane -D

# Resize panes: prefix + Shift + arrow key (repeatable, keep holding)
bind -r S-Left  resize-pane -L 5
bind -r S-Right resize-pane -R 5
bind -r S-Up    resize-pane -U 5
bind -r S-Down  resize-pane -D 5

# prefix + r reloads this file without restarting tmux
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Simple status bar: session name, window list, clock
set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[bold]#S  "
set -g status-right "%H:%M "
setw -g window-status-current-style "bg=colour39,fg=colour0,bold"
